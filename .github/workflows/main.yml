name: CI/CD Pipeline for PDF-STORE

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies & Run Tests
        run: |
          npm install
          npm test --if-present

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build # আপনার প্রজেক্টের তৈরি করা আউটপুট ফোল্ডার (যেমন: build বা dist)
