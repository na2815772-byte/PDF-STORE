<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Library - Homepage</title>
  
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    body { 
      background-color: #0f172a; 
      color: #f8fafc; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      padding: 15px 0 50px 0; 
    }

    /* Top Navigation Bar */
    .top-nav { 
      width: 100%; 
      padding: 0 15px 20px 15px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 30px; 
      border-bottom: 1px solid #334155; 
    }

    .big-pdf-badge { 
      background: #1e293b; 
      border: 2px solid #334155; 
      border-radius: 14px; 
      padding: 8px 18px; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      font-size: 22px; 
      font-weight: 900; 
      color: #38bdf8; 
      box-shadow: 0 4px 18px rgba(0,0,0,0.4); 
      letter-spacing: 1px;
    }

    .folder-sticker { 
      font-size: 28px; 
    }

    .search-wrapper { 
      display: flex; 
      align-items: center; 
      background: #1e293b; 
      border: 2px solid #334155; 
      border-radius: 30px; 
      padding: 4px 6px 4px 16px; 
      transition: all 0.3s ease;
    }

    .search-wrapper:focus-within {
      border-color: #ff007f;
      box-shadow: 0 0 14px rgba(255, 0, 127, 0.4);
    }

    .search-box { 
      border: none; 
      background: transparent; 
      color: #fff; 
      font-size: 15px; 
      outline: none; 
      width: 180px; 
    }

    .search-btn { 
      background: linear-gradient(135deg, #ff007f, #7928ca); 
      border: none; 
      color: #fff; 
      width: 36px; 
      height: 36px; 
      border-radius: 50%; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      transition: transform 0.2s;
    }

    .search-btn:hover {
      transform: scale(1.08);
    }

    /* Main Welcome Dashboard Box */
    .dashboard-header { 
      background: linear-gradient(135deg, rgba(30,41,89,0.9), rgba(76,29,149,0.8), rgba(15,23,42,0.9)); 
      border: 2px solid #7c3aed; 
      border-radius: 20px; 
      padding: 35px 20px; 
      max-width: 1200px; 
      margin: 0 auto 30px auto; 
      text-align: center; 
      box-shadow: 0 12px 35px rgba(124, 58, 237, 0.35);
      backdrop-filter: blur(10px);
    }

    .dashboard-title { 
      font-size: 28px; 
      font-weight: 900; 
      letter-spacing: 2px;
      text-transform: uppercase;
      display: inline-block;
      background: linear-gradient(90deg, #ff007f, #7928ca, #00f2fe, #4facfe, #00ff87, #ff007f); 
      background-size: 400% 400%; 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      animation: liveGlowLight 6s ease infinite; 
      filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.5));
    }

    @keyframes liveGlowLight { 
      0% { background-position: 0% 50%; } 
      50% { background-position: 100% 50%; } 
      100% { background-position: 0% 50%; } 
    }

    /* YOUR BOOK Dashboard */
    .your-book-wrapper { 
      text-align: center; 
      margin-bottom: 30px; 
    }

    .your-book-dashboard { 
      display: inline-block; 
      background: linear-gradient(135deg, #0284c7, #38bdf8); 
      border-radius: 12px; 
      padding: 12px 30px; 
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.35);
    }

    .your-book-title { 
      font-size: 20px; 
      font-weight: 800; 
      color: #ffffff; 
      letter-spacing: 2px; 
      text-transform: uppercase;
    }

    /* Book Grid Section */
    .results-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
      gap: 25px; 
      max-width: 1200px; 
      margin: 0 auto 40px auto; 
      padding: 0 20px; 
    }

    .pdf-card { 
      background: #1e293b; 
      border: 1px solid #334155; 
      border-radius: 12px; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .pdf-card:hover {
      transform: translateY(-5px);
      border-color: #38bdf8;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.2);
    }

    .pdf-title { 
      font-size: 18px; 
      font-weight: 700; 
      color: #f1f5f9; 
      margin-bottom: 8px; 
    }

    .pdf-desc { 
      font-size: 14px; 
      color: #94a3b8; 
      margin-bottom: 20px; 
    }

    .card-actions { 
      display: flex; 
      gap: 10px; 
    }

    .btn { 
      flex: 1; 
      text-align: center; 
      padding: 9px 12px; 
      font-size: 14px; 
      font-weight: 600; 
      border-radius: 6px; 
      cursor: pointer; 
      border: none; 
      transition: opacity 0.2s;
    }

    .btn-view { 
      background: #334155; 
      color: #38bdf8; 
      border: 1px solid #38bdf8; 
    }

    .btn-download { 
      background: linear-gradient(135deg, #0284c7, #38bdf8); 
      color: #fff; 
    }

    .btn:hover {
      opacity: 0.85;
    }

    /* Auth Section */
    .registration-section { 
      text-align: center; 
      max-width: 1200px; 
      margin: 20px auto 0 auto; 
      padding: 0 20px; 
    }

    .registration-note { 
      font-size: 16px; 
      font-weight: 700; 
      color: #38bdf8; 
      margin-bottom: 15px; 
      letter-spacing: 1px;
    }

    .auth-buttons { 
      display: flex; 
      justify-content: center; 
      gap: 15px; 
      flex-wrap: wrap; 
    }

    .btn-register, .btn-login, .btn-logout { 
      display: inline-block; 
      font-size: 18px; 
      font-weight: 800; 
      padding: 14px 40px; 
      border-radius: 30px; 
      text-decoration: none; 
      color: #fff; 
      cursor: pointer; 
      border: none; 
      letter-spacing: 1.5px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-register { 
      background: linear-gradient(135deg, #0284c7, #38bdf8); 
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4);
    }

    .btn-login { 
      background: linear-gradient(135deg, #ff007f, #7928ca); 
      box-shadow: 0 8px 25px rgba(255, 0, 127, 0.4);
    }

    .btn-logout { 
      background: linear-gradient(135deg, #ef4444, #991b1b); 
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4);
    }

    .btn-register:hover, .btn-login:hover, .btn-logout:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <div class="top-nav">
    <div class="big-pdf-badge">
      <span class="folder-sticker">📂</span>
      <span>PDF</span>
    </div>
    
    <!-- Live Search Input -->
    <div class="search-wrapper">
      <input type="text" id="searchInput" class="search-box" placeholder="Search PDF books...">
      <button class="search-btn" id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
  </div>

  <!-- Header Section -->
  <header class="dashboard-header">
    <h1 class="dashboard-title">WELCOME PDF LIBRARY START</h1>
  </header>

  <!-- Title Badge Section -->
  <div class="your-book-wrapper">
    <div class="your-book-dashboard">
      <h2 class="your-book-title">YOUR BOOK</h2>
    </div>
  </div>

  <!-- PDF Cards Container -->
  <main class="results-grid" id="resultsGrid">
    <div class="pdf-card">
      <div>
        <div class="pdf-title">Sample Book Title</div>
        <div class="pdf-desc">This is a short description about the PDF document file.</div>
      </div>
      <div class="card-actions">
        <button onclick="handlePdfAction('assets/sample.pdf', 'view')" class="btn btn-view">View PDF</button>
        <button onclick="handlePdfAction('assets/sample.pdf', 'download')" class="btn btn-download">Download</button>
      </div>
    </div>
  </main>

  <!-- Auth / Registration Area -->
  <div class="registration-section">
    <div class="registration-note" id="regNote">[Register or Login to get complete PDF for free]</div>
    <div class="auth-buttons" id="authBtnArea">
      <!-- JavaScript এর মাধ্যমে ডায়নামিকালি বাটনগুলো রেন্ডার হবে -->
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderAuthArea();
      setupSearchLogic();
    });

    // ১. ইউজার অ্যাকাউন্ট স্ট্যাটাস অনুসারে UI পরিবর্তন
    function renderAuthArea() {
      const isLoggedIn = sessionStorage.getItem('isLoggedIn');
      const authBtnArea = document.getElementById('authBtnArea');
      const regNote = document.getElementById('regNote');

      if (isLoggedIn === 'true') {
        const savedUser = JSON.parse(localStorage.getItem('registeredUser'));
        const userName = savedUser ? savedUser.name : 'User';

        regNote.innerHTML = `[Welcome Back, <strong style="color: #00f2fe;">${userName}</strong>!]`;
        authBtnArea.innerHTML = `
          <button onclick="logoutUser()" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> LOGOUT</button>
        `;
      } else {
        regNote.innerHTML = `[Register or Login to get complete PDF for free]`;
        authBtnArea.innerHTML = `
          <a href="register.html" class="btn-register">REGISTER NOW</a>
          <a href="login.html" class="btn-login">LOGIN NOW</a>
        `;
      }
    }

    // ২. PDF অ্যাকশন ও সিকিউরিটি গার্ড ফাংশন
    function handlePdfAction(fileUrl, actionType) {
      const isLoggedIn = sessionStorage.getItem('isLoggedIn');
      if (isLoggedIn === 'true') {
        if (actionType === 'view') {
          window.open(fileUrl, '_blank');
        } else if (actionType === 'download') {
          const a = document.createElement('a');
          a.href = fileUrl;
          a.download = fileUrl.split('/').pop();
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }
      } else {
        alert('Access Denied! PDF দেখতে বা ডাউনলোড করতে আগে Login অথবা Register করুন।');
        window.location.href = 'login.html';
      }
    }

    // ৩. লগআউট লজিক
    function logoutUser() {
      sessionStorage.removeItem('isLoggedIn');
      alert('You have logged out successfully.');
      renderAuthArea();
    }

    // ৪. লাইভ সার্চ ফিল্টারিং
    function setupSearchLogic() {
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('keyup', () => {
        const filter = searchInput.value.toLowerCase();
        const cards = document.querySelectorAll('.pdf-card');

        cards.forEach(card => {
          const title = card.querySelector('.pdf-title').innerText.toLowerCase();
          const desc = card.querySelector('.pdf-desc').innerText.toLowerCase();

          if (title.includes(filter) || desc.includes(filter)) {
            card.style.display = "flex";
          } else {
            card.style.display = "none";
          }
        });
      });
    }
  </script>
</body>
  </html>
